name: Disk diagnostic

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Disk before cleanup
        run: df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* /usr/share/swift \
            /usr/local/share/powershell /opt/az /usr/local/lib/node_modules \
            /usr/local/share/chromium /usr/share/miniconda
          sudo apt-get clean
          sudo docker image prune -af

      - name: Disk after cleanup
        run: df -h
